# EIP CI pipeline — enforces the QualityGatePolicy merge gates (G1/G2/G3-auto) on every PR to the
# repository's base branch. Gate → stage map (CodingStandards.md §1): Spotless/Checkstyle/Error
# Prone/NullAway/Modulith/ArchUnit = G1; JUnit + JaCoCo coverage ratchet = G2; ESLint + tsc + the
# openapi-typescript codegen drift check = G1 (frontend); gitleaks + dependency review =
# G3-automated; docs-lint (links/ids/counts/canonical greps) = G7. Branch protection making these
# checks required is in
# .github/rulesets/main-protection.json (applied via .github/README.md).
#
# Base branch: this repo has no `main`; its default/base branch is
# `claude/engineering-productivity-platform-04kbet` — CI triggers on PRs to it and on pushes to it
# and to the sprint integration branches (`integration/**`).
name: ci

on:
  pull_request:
    branches: [claude/engineering-productivity-platform-04kbet]
  push:
    branches: [claude/engineering-productivity-platform-04kbet, 'integration/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Static analysis (Spotless, Checkstyle, Error Prone, NullAway) — G1
        working-directory: backend
        run: ./gradlew --no-daemon spotlessCheck checkstyleMain checkstyleTest compileJava compileTestJava
      - name: Build + unit + Modulith/ArchUnit tests — G1/G2
        working-directory: backend
        run: ./gradlew --no-daemon build check
      - name: Coverage ratchet (JaCoCo) — G2
        working-directory: backend
        run: ./gradlew --no-daemon jacocoTestCoverageVerification

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pinned pnpm (corepack)
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
      - name: Install (frozen lockfile)
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Static analysis (Prettier, ESLint, tsc) — G1
        working-directory: frontend
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
      # DEBT-016 RESOLVED: src/api/types.ts is now a thin re-export of openapi-typescript-generated
      # schemas (src/api/generated.ts), generated from the committed
      # backend/eip-app/openapi/eip-openapi-v1.json snapshot. This step regenerates into the same
      # committed path and fails the build on any diff — the frontend-codegen drift gate, mirroring
      # the additive-only OpenAPI diff gate spirit (DEBT-011, backend-side, tracked separately).
      - name: OpenAPI→TS codegen drift check — G1
        working-directory: frontend
        run: pnpm generate:api:check
      - name: Unit tests (Vitest) — G2
        working-directory: frontend
        run: pnpm test
      - name: Build — G1
        working-directory: frontend
        run: pnpm build

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks) — G3-auto
        run: |
          GITLEAKS_VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --no-banner --redact --exit-code 1
      # DEBT-015 RESOLVED: the GitHub Dependency Graph API was unavailable on this repo (compare
      # endpoint returned 403) until Dependabot vulnerability alerts were enabled
      # (PUT /repos/.../vulnerability-alerts, a prerequisite for the graph on a public repo); the
      # compare endpoint now returns 200. Blocking (no continue-on-error) — fail-on-severity: high
      # is enforced for real on every PR.
      - name: Dependency review (PR only) — G3-auto
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          # GHSA-fx2h-pf6j-xcff (vite `server.fs.deny` bypass via Windows alternate-data-stream
          # paths): a Vite DEV-SERVER-only bypass of a filesystem-access guard, reachable only when
          # untrusted network clients can reach a running `vite`/`vite dev` process on Windows. This
          # project's dev server is a local-only tool run by individual engineers, never exposed as
          # a network service — so the realistic exposure is nil. The fix requires vite 6.4.3+/7.x+,
          # which pulls @vitejs/plugin-react past a version whose OWN peer range (^8.0.0) outruns the
          # available vite 7.x line (tested: unmet peer), so taking the major bump now trades one
          # accepted, scoped, low-exposure finding for a genuine, unresolved peer-dependency break.
          # Every other finding this scan surfaces (vitest RCE, brace-expansion ReDoS, js-yaml DoS)
          # was fixed for real (see DEBT-015). Revisit when the vite 7/8 + plugin-react pairing
          # stabilizes.
          allow-ghsas: GHSA-fx2h-pf6j-xcff

  docs-lint:
    name: docs-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Documentation lint (links, id refs, counts, canonical values) — G7
        run: python3 scripts/docs-lint/docs_lint.py
