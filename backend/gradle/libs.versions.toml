# Version catalog — the single source of truth for backend dependency versions.
# Fixed stack per docs/product/PRD.md §7 constraint 3. Adding/changing a version is
# governed by engineering-operating-system/DependencyManagement.md (owning-architect
# approval + license allow-list + air-gap fitness).

[versions]
java = "21"
springBoot = "3.4.1"
springDependencyManagement = "1.1.7"
springModulith = "1.3.1"
spotless = "6.25.0"
googleJavaFormat = "1.24.0"
foojayResolver = "0.8.0"
# Static-analysis + test tooling wired by TASK-0002 (CI gates). buildSrc mirrors these by hand
# until DEBT-001 (catalog-in-buildSrc wiring) is paid.
errorpronePlugin = "4.1.0"
errorproneCore = "2.36.0"
nullaway = "0.12.1"
checkstyle = "10.20.1"
jacoco = "0.8.12"
junit = "5.11.3"
archunit = "1.3.0"
# Nullness contract (JSpecify) + AssertJ, introduced with the eip-core shared kernel (TASK-0005).
# JSpecify is the portable @NullMarked/@Nullable surface NullAway reads (CodingStandards §2.1);
# AssertJ is the mandated backend assertion library (CodingStandards §5).
jspecify = "1.0.0"
assertj = "3.26.3"
# springdoc — OpenAPI 3 generation for the /api/v1 surface (TASK-0010). Not managed by the Boot BOM.
springdoc = "2.7.0"

[libraries]
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
# Spring Boot dependency BOM — imported as a platform by library modules (which, unlike eip-app,
# do not apply io.spring.dependency-management) so persistence/test versions (Flyway, Postgres,
# Testcontainers, Mockito) resolve managed. Introduced with the persistence spine (TASK-0009).
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }
spring-modulith-starter-core = { module = "org.springframework.modulith:spring-modulith-starter-core", version.ref = "springModulith" }
spring-modulith-bom = { module = "org.springframework.modulith:spring-modulith-bom", version.ref = "springModulith" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
springdoc-openapi-webmvc = { module = "org.springdoc:springdoc-openapi-starter-webmvc-api", version.ref = "springdoc" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
foojay-resolver = { id = "org.gradle.toolchains.foojay-resolver-convention", version.ref = "foojayResolver" }
