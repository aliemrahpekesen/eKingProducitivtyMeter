# Version catalog — the single source of truth for backend dependency versions.
# Fixed stack per docs/product/PRD.md §7 constraint 3. Adding/changing a version is
# governed by engineering-operating-system/DependencyManagement.md (owning-architect
# approval + license allow-list + air-gap fitness).

[versions]
java = "21"
springBoot = "3.4.1"
springDependencyManagement = "1.1.7"
springModulith = "1.3.1"
spotless = "6.25.0"
googleJavaFormat = "1.24.0"
# foojayResolver: NOT referenced by settings.gradle.kts's own `plugins {}` block (DEBT-001
# residual) — Gradle resolves a settings file's own plugins{} block before that same file's
# `dependencyResolutionManagement.versionCatalogs`/implicit gradle/libs.versions.toml catalog is
# available, so `alias(libs.plugins...)` cannot be used there. buildSrc's settings.gradle.kts (a
# separate build) has no such chicken-and-egg problem and wires this catalog normally (see below).
# Keep this version in sync with settings.gradle.kts's hardcoded literal by hand.
foojayResolver = "0.8.0"
# Static-analysis + test tooling wired by TASK-0002 (CI gates); buildSrc now consumes this catalog
# directly via its own settings.gradle.kts versionCatalogs block (DEBT-001, paid).
errorpronePlugin = "4.1.0"
errorproneCore = "2.36.0"
nullaway = "0.12.1"
checkstyle = "10.20.1"
jacoco = "0.8.12"
junit = "5.11.3"
archunit = "1.3.0"
# WireMock (BackendPlan §14: sync engine tested against WireMock'd connectors); standalone
# (shaded) jar avoids Jetty/Tomcat classpath clashes.
wiremock = "3.9.1"
# Nullness contract (JSpecify) + AssertJ, introduced with the eip-core shared kernel (TASK-0005).
# JSpecify is the portable @NullMarked/@Nullable surface NullAway reads (CodingStandards §2.1);
# AssertJ is the mandated backend assertion library (CodingStandards §5).
jspecify = "1.0.0"
assertj = "3.26.3"
# springdoc — OpenAPI 3 generation for the /api/v1 surface (TASK-0010). Not managed by the Boot BOM.
springdoc = "2.7.0"

[libraries]
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
# Spring Boot dependency BOM — imported as a platform by library modules (which, unlike eip-app,
# do not apply io.spring.dependency-management) so persistence/test versions (Flyway, Postgres,
# Testcontainers, Mockito) resolve managed. Introduced with the persistence spine (TASK-0009).
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }
spring-modulith-starter-core = { module = "org.springframework.modulith:spring-modulith-starter-core", version.ref = "springModulith" }
spring-modulith-bom = { module = "org.springframework.modulith:spring-modulith-bom", version.ref = "springModulith" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
springdoc-openapi-webmvc = { module = "org.springdoc:springdoc-openapi-starter-webmvc-api", version.ref = "springdoc" }

# --- buildSrc's own plugin classpath (DEBT-001) — buildSrc/build.gradle.kts's `implementation(...)`
# dependencies bring these Gradle plugin JARs onto buildSrc's own classpath so the precompiled
# convention plugins under buildSrc/src/main/kotlin can `id(...)`/`alias(...)` them without a
# version (already resolved here). Same version.ref as the [plugins] entries below — one number
# each, never duplicated as a bare string.
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "springBoot" }
spring-dependency-management-plugin = { module = "io.spring.gradle:dependency-management-plugin", version.ref = "springDependencyManagement" }
spotless-plugin-gradle = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
gradle-errorprone-plugin = { module = "net.ltgt.gradle:gradle-errorprone-plugin", version.ref = "errorpronePlugin" }

# --- Static analysis (eip.java-conventions.gradle.kts) ---
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorproneCore" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }

# --- Test frameworks referenced from buildSrc (eip.modulith-conventions.gradle.kts) and modules ---
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
wiremock-standalone = { module = "org.wiremock:wiremock-standalone", version.ref = "wiremock" }

# --- Boot-BOM/Modulith-BOM-managed coordinates repeated across module build files — no
# version.ref (the enclosing platform() import pins the version; duplicating a literal here would
# itself violate DEBT-001), aliased purely to remove copy-pasted coordinate strings.
spring-modulith-core = { module = "org.springframework.modulith:spring-modulith-core" }
spring-modulith-docs = { module = "org.springframework.modulith:spring-modulith-docs" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind" }
jackson-datatype-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310" }
spring-context = { module = "org.springframework:spring-context" }
spring-jdbc = { module = "org.springframework:spring-jdbc" }
spring-tx = { module = "org.springframework:spring-tx" }
postgresql = { module = "org.postgresql:postgresql" }
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql" }
testcontainers-kafka = { module = "org.testcontainers:kafka" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
foojay-resolver = { id = "org.gradle.toolchains.foojay-resolver-convention", version.ref = "foojayResolver" }
