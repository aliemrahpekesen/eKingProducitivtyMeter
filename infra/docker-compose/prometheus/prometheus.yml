# EIP dev Prometheus (TASK-0003). Self-observability scrape targets grow as services expose metrics.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
  # - job_name: eip-app        # added with app observability wiring (P0-E4-S3, SPRINT-01)
  #   metrics_path: /actuator/prometheus
  #   static_configs: [{ targets: ["host.docker.internal:8081"] }]
