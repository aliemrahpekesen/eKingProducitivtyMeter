# Secret-bearing backend values (DEBT-005 CHANGE_ME convention). Rendered ONLY when the operator
# has not pointed secrets.existingSecret at a pre-provisioned Secret (kubectl create secret /
# External Secrets Operator — see docs/infrastructure/HelmDeployment.md). The CHANGE_ME defaults
# are intentional: they reach ProductionSecretsGuard (com.eip.app.config, DEBT-005) exactly as a
# local prod/preprod install's CHANGE_ME would, and eip-app refuses to boot rather than start with
# a placeholder secret — this chart never silently deploys a weak default.
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "eip.secretName" . }}
  labels:
    {{- include "eip.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
type: Opaque
stringData:
  EIP_APP_DB_PASSWORD: {{ .Values.secrets.appDbPassword | quote }}
  EIP_MIGRATOR_DB_PASSWORD: {{ .Values.secrets.migratorDbPassword | quote }}
  EIP_SECRETS_MASTER_KEY: {{ .Values.secrets.secretsMasterKey | quote }}
{{- end }}
