apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "eip.backend.fullname" . }}
  labels:
    {{- include "eip.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "eip.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "eip.backend.selectorLabels" . | nindent 8 }}
      annotations:
        # Forces a rollout whenever the ConfigMap or (chart-managed) Secret content changes —
        # Deployments do not otherwise notice env-source edits (KubernetesOpenShift.md §12.1).
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.secrets.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: eip-app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "eip.backend.fullname" . }}-config
          env:
            - name: EIP_APP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "eip.secretName" . }}
                  key: EIP_APP_DB_PASSWORD
            - name: EIP_MIGRATOR_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "eip.secretName" . }}
                  key: EIP_MIGRATOR_DB_PASSWORD
            - name: EIP_SECRETS_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "eip.secretName" . }}
                  key: EIP_SECRETS_MASTER_KEY
          # eip-app has no split management port today (values.yaml containerPort comment) — every
          # probe below targets the single http port.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
